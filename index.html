<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>CleanLabel Food Scanner</title>

  <!-- Chrome Tab & Mobile Browser Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23064e3b'/%3E%3Cstop offset='50%25' stop-color='%23047857'/%3E%3Cstop offset='100%25' stop-color='%230f172a'/%3E%3C/linearGradient%3E%3ClinearGradient id='a' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fb7185'/%3E%3Cstop offset='40%25' stop-color='%23f43f5e'/%3E%3Cstop offset='100%25' stop-color='%23be123c'/%3E%3C/linearGradient%3E%3ClinearGradient id='c' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fef08a'/%3E%3Cstop offset='100%25' stop-color='%23ca8a04'/%3E%3C/linearGradient%3E%3ClinearGradient id='l' x1='0%25' y1='0%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8' stop-opacity='0'/%3E%3Cstop offset='50%25' stop-color='%23fff'/%3E%3Cstop offset='100%25' stop-color='%2338bdf8' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='115' fill='url(%23b)'/%3E%3Ccircle cx='256' cy='245' r='160' fill='%23065f46' fill-opacity='.35' stroke='%2334d399' stroke-width='4' stroke-dasharray='8 6'/%3E%3Ccircle cx='295' cy='275' r='75' fill='url(%23c)'/%3E%3Cpath d='M215 190c20 0 35 15 40 25 5-10 20-25 40-25 50 0 70 50 60 105-10 50-50 60-90 55-7-1-13-1-20 0-40 5-80-5-90-55-10-55 10-105 60-105z' fill='url(%23a)'/%3E%3Cellipse cx='200' cy='240' rx='20' ry='38' transform='rotate(-25 200 240)' fill='%23fff' fill-opacity='.28'/%3E%3Cpath d='M255 210c0-25 13-40 23-50' stroke='%2378350f' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3Cpath d='M255 185c-25-20-15-45 15-40 0 25-15 40-15 40z' fill='%234ade80'/%3E%3Cpath d='M120 175v-35a15 15 0 0 1 15-15h35m172 0h35a15 15 0 0 1 15 15v35m-272 140v35a15 15 0 0 0 15 15h35m172 0h35a15 15 0 0 0 15-15v-35' stroke='%2334d399' stroke-width='9' stroke-linecap='round' fill='none'/%3E%3Cline x1='85' y1='265' x2='427' y2='265' stroke='url(%23l)' stroke-width='8'/%3E%3C/svg%3E" />

  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-white">

  <!-- Header with App Icon -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 px-4 py-2.5 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center space-x-2.5">
      <svg class="w-8 h-8 flex-shrink-0 rounded-xl shadow border border-emerald-500/30" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#064e3b" /><stop offset="50%" stop-color="#047857" /><stop offset="100%" stop-color="#0f172a" />
          </linearGradient>
          <linearGradient id="hApple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fb7185" /><stop offset="40%" stop-color="#f43f5e" /><stop offset="100%" stop-color="#be123c" />
          </linearGradient>
          <linearGradient id="hCitrus" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" /><stop offset="100%" stop-color="#ca8a04" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="115" fill="url(#hBg)" />
        <circle cx="256" cy="245" r="160" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="4" stroke-dasharray="8 6" />
        <circle cx="295" cy="275" r="75" fill="url(#hCitrus)" />
        <path d="M 215 190 C 235 190 250 205 255 215 C 260 205 275 190 295 190 C 345 190 365 240 355 295 C 345 345 305 355 265 350 C 258 349 252 349 245 350 C 205 355 165 345 155 295 C 145 240 165 190 215 190 Z" fill="url(#hApple)" />
        <ellipse cx="200" cy="240" rx="20" ry="38" transform="rotate(-25 200 240)" fill="#ffffff" fill-opacity="0.28" />
        <path d="M 255 210 C 255 185 268 170 278 160" stroke="#78350f" stroke-width="7" stroke-linecap="round" fill="none" />
        <path d="M 255 185 C 230 165 240 140 270 145 C 270 170 255 185 255 185 Z" fill="#4ade80" />
        <line x1="85" y1="265" x2="427" y2="265" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
        <line x1="110" y1="265" x2="402" y2="265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      </svg>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide leading-tight">CleanLabel Scanner</h1>
        <p class="text-[10px] text-slate-400 leading-tight">Packaged Food Ingredients Checker</p>
      </div>
    </div>
  </header>

  <!-- Centered Content Area -->
  <main class="flex-1 flex flex-col justify-center p-4 max-w-md mx-auto w-full space-y-4 pb-10">
    
    <!-- Camera Viewfinder -->
    <div class="relative bg-black rounded-2xl overflow-hidden aspect-video border border-slate-700 flex items-center justify-center shadow-lg">
      <video id="video-feed" class="w-full h-full object-cover" autoplay playsinline webkit-playsinline muted></video>
      <div id="reticle" class="absolute inset-0 border-2 border-emerald-500/40 rounded-2xl pointer-events-none flex items-center justify-center hidden">
        <div class="w-44 h-24 border-2 border-dashed border-emerald-400 rounded-lg animate-pulse"></div>
      </div>
      <button id="btn-toggle-camera" class="absolute bottom-3 bg-slate-800/90 text-white text-xs px-3.5 py-1.5 rounded-lg border border-slate-600 shadow hover:bg-slate-700 transition">
        Start Camera
      </button>
    </div>

    <!-- Error message alert box (hidden by default) -->
    <div id="camera-error-box" class="hidden p-3 bg-red-950/80 border border-red-500/50 rounded-xl text-red-200 text-xs font-mono"></div>

    <!-- Manual Barcode Lookup -->
    <div class="flex space-x-2">
      <input id="manual-barcode" type="text" placeholder="Barcode (e.g. 096619...)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 placeholder-slate-500" />
      <button id="btn-manual-lookup" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-medium transition">Lookup</button>
    </div>

    <!-- Product Analysis Card -->
    <div id="product-card" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-start justify-between">
        <div>
          <h2 id="product-name" class="font-bold text-sm text-white">Product Name</h2>
          <p id="product-brand" class="text-xs text-slate-400">Brand</p>
        </div>
        <button id="btn-edit-product" class="text-[11px] text-emerald-400 hover:underline">Edit / Enrich</button>
      </div>

      <div class="overflow-hidden rounded-xl border border-slate-700/60 bg-slate-900/40">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-slate-700 text-slate-400 bg-slate-800/50">
              <th class="p-2 font-medium">Category</th>
              <th class="p-2 font-medium text-center">Status</th>
              <th class="p-2 font-medium">Flagged Elements</th>
            </tr>
          </thead>
          <tbody id="evaluation-table-body" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>

      <div class="pt-2 border-t border-slate-700">
        <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Raw Ingredients</span>
        <p id="ingredients-raw" class="text-[11px] text-slate-300 leading-relaxed max-h-24 overflow-y-auto bg-slate-900/80 p-2.5 rounded-lg mt-1 font-mono"></p>
      </div>
    </div>

    <!-- Missing / Custom Food Enrichment Form -->
    <div id="enrichment-card" class="hidden bg-slate-800 border border-amber-500/50 rounded-2xl p-4 space-y-3">
      <div class="flex items-center space-x-2">
        <span class="text-amber-400 text-base">⚠️</span>
        <div>
          <h3 class="font-semibold text-xs text-amber-300">Food Item Needs Enrichment</h3>
          <p class="text-[11px] text-slate-400">Save custom ingredients for this barcode to your local database.</p>
        </div>
      </div>
      <div class="space-y-2 text-xs">
        <input id="enrich-name" type="text" placeholder="Item Name (e.g., PCC Granola)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" />
        <input id="enrich-brand" type="text" placeholder="Brand (e.g., Kirkland Signature)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" />
        <textarea id="enrich-ingredients" rows="3" placeholder="Paste or type ingredients list..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-mono text-[11px]"></textarea>
        <div class="grid grid-cols-3 gap-2">
          <input id="enrich-sugar" type="number" step="0.1" placeholder="Sugars (g)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-[11px]" />
          <input id="enrich-satfat" type="number" step="0.1" placeholder="Sat. Fat (g)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-[11px]" />
          <input id="enrich-sodium" type="number" step="1" placeholder="Sodium (mg)" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-[11px]" />
        </div>
      </div>
      <div class="flex space-x-2 pt-1">
        <button id="btn-save-enrichment" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white text-xs py-2 rounded-lg font-medium transition">Save to My Database</button>
        <button id="btn-cancel-enrichment" class="px-3 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg text-slate-300">Cancel</button>
      </div>
    </div>

  </main>

  <script>
    // 1. Automatic Cache-Busting (Existing)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let reg of regs) reg.unregister();
      });
    }
  
    // 2. Register New Service Worker (ADD THIS BLOCK)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js') // Pointing to the new file
          .then((registration) => {
            console.log('ServiceWorker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.error('ServiceWorker registration failed:', error);
          });
      });
    }

    const CRITERIA = {
      carcinogens: ['bha', 'bht', 'tbhq', 'potassium bromate', 'potassium iodate', 'sodium nitrite', 'sodium nitrate', 'propyl gallate', 'acrylamide'],
      seedOils: ['canola oil', 'soybean oil', 'corn oil', 'cottonseed oil', 'sunflower oil', 'safflower oil', 'grapeseed oil', 'rice bran oil'],
      artificialColors: ['red 40', 'red 3', 'yellow 5', 'yellow 6', 'blue 1', 'blue 2', 'caramel color', 'caramel colour', 'fd&c'],
      cholesterolRisks: ['partially hydrogenated', 'hydrogenated', 'shortening', 'lard', 'palm kernel oil'],
      emulsifiers: ['polysorbate 80', 'polysorbate 60', 'carrageenan', 'carboxymethylcellulose', 'cellulose gum', 'mono- and diglycerides', 'monoglycerides', 'diglycerides'],
      sweeteners: ['aspartame', 'sucralose', 'acesulfame-k', 'acesulfame potassium', 'saccharin', 'erythritol', 'maltitol', 'high fructose corn syrup'],
      preservatives: ['sodium benzoate', 'potassium sorbate', 'calcium propionate', 'sulfur dioxide', 'sodium bisulfite', 'sodium metabisulfite'],
      doughConditioners: ['azodicarbonamide', 'bleached flour', 'bleached wheat flour', 'datem', 'l-cysteine'],
      flavorEnhancers: ['monosodium glutamate', 'msg', 'yeast extract', 'autolyzed yeast', 'hydrolyzed protein', 'disodium inosinate', 'disodium guanylate']
    };

    // Restrict scanner to supermarket 1D barcodes for instant detection
    const hints = new Map();
    const formats = [
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);

    const codeReader = new ZXing.BrowserMultiFormatReader(hints);
    let localStream = null;
    let isScanning = false;
    let currentBarcode = null;

    const toggleBtn = document.getElementById('btn-toggle-camera');
    const manualBtn = document.getElementById('btn-manual-lookup');
    const manualInput = document.getElementById('manual-barcode');
    const reticle = document.getElementById('reticle');
    const errorBox = document.getElementById('camera-error-box');
    const videoEl = document.getElementById('video-feed');

    toggleBtn.addEventListener('click', async () => {
      if (isScanning) {
        stopScanner();
      } else {
        await startScanner();
      }
    });

    async function startScanner() {
      if (errorBox) errorBox.classList.add('hidden');

      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = localStream;
        await videoEl.play();

        toggleBtn.innerText = "Stop Camera";
        reticle.classList.remove('hidden');
        isScanning = true;

        // Continuous loop: inspects every incoming frame until a barcode matches
        codeReader.decodeFromStream(localStream, videoEl, (result, err) => {
          if (result) {
            const barcode = result.getText ? result.getText() : result.text;
            stopScanner();
            fetchAndAnalyze(barcode);
          }
        });

      } catch (err) {
        console.error("Camera failure:", err);
        stopScanner();
        if (errorBox) {
          errorBox.classList.remove('hidden');
          errorBox.innerText = `Camera Error: ${err.name} - ${err.message}`;
        }
      }
    }

    function stopScanner() {
      if (codeReader) {
        try { codeReader.reset(); } catch (e) {}
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      videoEl.srcObject = null;
      isScanning = false;
      reticle.classList.add('hidden');
      toggleBtn.innerText = "Start Camera";
    }

    manualBtn.addEventListener('click', () => {
      const code = manualInput.value.trim();
      if (code) fetchAndAnalyze(code);
    });

    async function fetchAndAnalyze(barcode) {
      currentBarcode = barcode;

      // 1. Check local persistent storage
      const localData = localStorage.getItem(`food_${barcode}`);
      if (localData) {
        renderAnalysis(JSON.parse(localData));
        return;
      }

      // 2. Fetch from Open Food Facts
      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
        const data = await res.json();

        if (data.status === 1 && data.product) {
          const product = {
            name: data.product.product_name || "Unknown Product",
            brand: data.product.brands || "Unknown Brand",
            ingredients: data.product.ingredients_text || "",
            sugar100g: data.product.nutriments?.sugars_100g || 0,
            addedSugar100g: data.product.nutriments?.['added-sugars_100g'] || 0,
            satFat100g: data.product.nutriments?.['saturated-fat_100g'] || 0,
            sodium100g: data.product.nutriments?.sodium_100g || 0,
            salt100g: data.product.nutriments?.salt_100g || 0
          };
          renderAnalysis(product);
        } else {
          promptEnrichment(barcode);
        }
      } catch (e) {
        promptEnrichment(barcode);
      }
    }

    function renderAnalysis(item) {
      document.getElementById('enrichment-card').classList.add('hidden');
      document.getElementById('product-card').classList.remove('hidden');

      document.getElementById('product-name').innerText = item.name;
      document.getElementById('product-brand').innerText = item.brand;
      document.getElementById('ingredients-raw').innerText = item.ingredients || "No ingredients listed.";

      const text = (item.ingredients || "").toLowerCase();

      const findMatches = (arr) => arr.filter(term => text.includes(term));
      const cMatches = findMatches(CRITERIA.carcinogens);
      const sMatches = findMatches(CRITERIA.seedOils);
      const dyeMatches = findMatches(CRITERIA.artificialColors);
      const emMatches = findMatches(CRITERIA.emulsifiers);
      const swMatches = findMatches(CRITERIA.sweeteners);
      const chMatches = findMatches(CRITERIA.cholesterolRisks);
      const presMatches = findMatches(CRITERIA.preservatives);
      const doughMatches = findMatches(CRITERIA.doughConditioners);
      const msgMatches = findMatches(CRITERIA.flavorEnhancers);

      // Sugar calculation
      const addedSugar = Number(item.addedSugar100g || 0);
      const totalSugar = Number(item.sugar100g || 0);
      const isHighSugar = addedSugar > 2.5 || totalSugar > 5;
      const sugarDetails = addedSugar > 0 
        ? `${addedSugar}g added sugar (${isHighSugar ? 'Exceeds budget' : 'Low'})`
        : `${totalSugar}g total sugar / 100g (${isHighSugar ? 'High' : 'Acceptable'})`;

      const satFat = Number(item.satFat100g) || 0;
      const isHighSatFat = satFat > 4 || chMatches.length > 0;
      
      const sodium100g = Number(item.sodium100g || (item.salt100g ? item.salt100g / 2.5 : 0)) || 0;
      const isHighSodium = sodium100g > 0.6; // >600mg sodium per 100g standard threshold

      const rows = [
        { name: "Carcinogenic Additives", bad: cMatches.length > 0, info: cMatches.join(", ") },
        { name: "Industrial Seed Oils", bad: sMatches.length > 0, info: sMatches.join(", ") },
        { name: "Artificial Colors", bad: dyeMatches.length > 0, info: dyeMatches.join(", ") },
        { name: "Sugar Level", bad: isHighSugar, info: sugarDetails },
        { name: "Cholesterol / Trans Fat", bad: isHighSatFat, info: `${satFat}g sat fat ${chMatches.length ? '(' + chMatches.join(', ') + ')' : ''}` },
        { name: "Gut Emulsifiers", bad: emMatches.length > 0, info: emMatches.join(", ") },
        { name: "Synthetic Sweeteners", bad: swMatches.length > 0, info: swMatches.join(", ") },
        { name: "Sodium / Salt Level", bad: isHighSodium, info: `${Math.round(sodium100g * 1000)}mg Na / 100g ${isHighSodium ? '(High Sodium)' : '(Moderate/Low)'}` },
        { name: "Synthetic Preservatives", bad: presMatches.length > 0, info: presMatches.join(", ") },
        { name: "Dough Conditioners / Bleached", bad: doughMatches.length > 0, info: doughMatches.join(", ") },
        { name: "Flavor Enhancers (MSG)", bad: msgMatches.length > 0, info: msgMatches.join(", ") }
      ];

      const tbody = document.getElementById('evaluation-table-body');
      tbody.innerHTML = rows.map(r => `
        <tr class="hover:bg-slate-800/40">
          <td class="p-2 text-slate-200 font-medium">${r.name}</td>
          <td class="p-2 text-center text-sm">${r.bad ? '🔴' : '🟢'}</td>
          <td class="p-2 text-slate-400 capitalize text-[11px]">${r.bad ? r.info : 'None detected'}</td>
        </tr>
      `).join('');
    }

    function promptEnrichment(barcode) {
      document.getElementById('product-card').classList.add('hidden');
      const enrichCard = document.getElementById('enrichment-card');
      enrichCard.classList.remove('hidden');

      document.getElementById('enrich-name').value = '';
      document.getElementById('enrich-brand').value = '';
      document.getElementById('enrich-ingredients').value = '';
      document.getElementById('enrich-sugar').value = '';
      document.getElementById('enrich-satfat').value = '';
      document.getElementById('enrich-sodium').value = '';
    }

    document.getElementById('btn-save-enrichment').addEventListener('click', () => {
      if (!currentBarcode) return;
      const enrichedProduct = {
        name: document.getElementById('enrich-name').value || "Custom Item",
        brand: document.getElementById('enrich-brand').value || "Custom Brand",
        ingredients: document.getElementById('enrich-ingredients').value || "",
        sugar100g: Number(document.getElementById('enrich-sugar').value) || 0,
        satFat100g: Number(document.getElementById('enrich-satfat').value) || 0,
        sodium100g: (Number(document.getElementById('enrich-sodium').value) || 0) / 1000
      };

      localStorage.setItem(`food_${currentBarcode}`, JSON.stringify(enrichedProduct));
      renderAnalysis(enrichedProduct);
    });

    document.getElementById('btn-cancel-enrichment').addEventListener('click', () => {
      document.getElementById('enrichment-card').classList.add('hidden');
    });

    document.getElementById('btn-edit-product').addEventListener('click', () => {
      promptEnrichment(currentBarcode);
    });
  </script>
</body>
</html>
